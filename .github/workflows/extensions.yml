name: Check extensions
on:
  pull_request:
    paths:
      - 'extensions/**'
      - 'tools/check_extensions.py'
      - '.github/workflows/extensions.yml'
  push:
    branches: [main, dev]
    paths:
      - 'extensions/**'
      - 'tools/check_extensions.py'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Qt QML tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qt6-declarative-dev-tools qml6-module-qttest qml6-module-qtquick qml6-module-qtquick-window qml6-module-qtqml qml6-module-qtqml-workerscript
      - name: Check every extension folder
        # Quickshell is not packaged for Ubuntu, so qmllint runs without it and
        # only errors fail the job; the unit tests import QtQuick and QtTest only.
        run: python3 tools/check_extensions.py --qt auto
